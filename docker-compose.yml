# Docker Compose for fcom-saas
# Full-stack container orchestration

name: fcom-saas

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: fcom-saas-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://server:3001
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - fcom-saas-network

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: fcom-saas-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/fcom-saas
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - fcom-saas-network

  db:
    image: postgres:16-alpine
    container_name: fcom-saas-postgres
    environment:
      POSTGRES_DB: fcom-saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - fcom-saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fcom-saas-network

networks:
  fcom-saas-network:
    driver: bridge

volumes:
  fcom-saas_postgres_data:
