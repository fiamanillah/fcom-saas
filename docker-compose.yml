# Docker Compose for syncdocket
# Full-stack container orchestration

name: syncdocket

services:
  app:
    build:
      context: ./apps/app
      dockerfile: Dockerfile
    container_name: syncdocket-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://server:3001
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - syncdocket-network

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: syncdocket-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/syncdocket
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - syncdocket-network

  db:
    image: postgres:16-alpine
    container_name: syncdocket-postgres
    environment:
      POSTGRES_DB: syncdocket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - syncdocket_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - syncdocket-network

networks:
  syncdocket-network:
    driver: bridge

volumes:
  syncdocket_postgres_data:
